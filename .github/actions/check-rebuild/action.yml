name: Check if rebuild required
description:

inputs:
  mode:
    description: build mode to be checked
    required: false
    default: build

runs:
  using: composite
  steps:
    - run: |
        tmpfile=$(mktemp)
        # PR changes since the merge base, deletions and both rename sides included; unpiped so git errors fail.
        # Non-PR events (e.g., the scheduled Yocto build) have no PR range and keep an empty list.
        if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
          git diff --name-only --no-renames ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} > ${tmpfile}
        fi
        echo "changed_file_list=${tmpfile}" >> "$GITHUB_ENV"
        # get_rebuild_flag.sh prints 0 or 1 and exits nonzero on checker
        # failure, which fails this "sh -e" step instead of silently
        # skipping the job.
        rebuild=$(bash .github/actions/check-rebuild/get_rebuild_flag.sh ${tmpfile} ${{ inputs.mode }})
        echo "Rebuild required: ${rebuild}"
        echo "rebuild=${rebuild}" >> "$GITHUB_ENV"
      shell: sh
