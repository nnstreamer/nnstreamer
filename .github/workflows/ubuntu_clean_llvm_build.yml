name: Minimal meson build in Ubuntu with LLVM/clang

on:
  pull_request:
    branches: [ main ]

jobs:
  async-race:
    name: Asynchronous output race gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - name: Install model-free test dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential meson ninja-build pkg-config \
          libglib2.0-dev libjson-glib-dev libgstreamer1.0-dev \
          libgstreamer-plugins-base1.0-dev libunwind-dev libgtest-dev \
          liborc-0.4-dev libpng-dev flex bison gstreamer1.0-plugins-base valgrind
    - name: Build instrumented core and asynchronous fixture
      env:
        CC: gcc
        CXX: g++
      run: |
        meson setup build-tsan --wrap-mode=nodownload --buildtype=debug \
          -Db_sanitize=thread -Dpython3-support=disabled \
          -Dnnstreamer-edge-support=disabled
        meson compile -C build-tsan -j2
    - name: Check selected-output ownership with Memcheck
      env:
        CC: gcc
        CXX: g++
      run: |
        meson setup build-ownership --wrap-mode=nodownload --buildtype=debug \
          -Dpython3-support=disabled -Dnnstreamer-edge-support=disabled
        meson compile -C build-ownership -j2
        meson test -C build-ownership --no-rebuild -v unittest_filter_common \
          --test-args='--gtest_filter=testFilterAsyncOutput.*' \
          --wrapper='valgrind --error-exitcode=99 --leak-check=full --show-leak-kinds=definite,indirect --errors-for-leak-kinds=definite,indirect'
    - name: Check the race detector and its unsafe negative control
      run: python3 tests/nnstreamer_filter_common/check_async_tsan.py build-tsan
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: Async_TSan_Testlog
        path: |
          build-tsan/meson-logs/
          build-ownership/meson-logs/

  build:
    name: Build on Ubuntu with LLVM/Clang
    needs: async-race
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-22.04 ]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Check if rebuild required
      uses: ./.github/actions/check-rebuild
      with:
        mode: rebuild
    - if: env.rebuild == '1'
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: install minimal requirements
      if: env.rebuild == '1'
      run: |
          sudo apt-get update && \
          sudo apt-get install -y libglib2.0-dev libjson-glib-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libunwind-dev googletest \
            gstreamer1.0-plugins-good clang
    - run: pip install meson ninja
      if: env.rebuild == '1'
    - run: meson setup build/
      if: env.rebuild == '1'
      env:
        CC: clang
        CXX: clang++
    - run: meson compile -C build/
      if: env.rebuild == '1'
    - run: meson test -C build/ -v
      if: env.rebuild == '1'
    - name: build with orcc-support disabled
      if: env.rebuild == '1'
      run: |
        meson setup build-noorc/ -Dorcc-support=disabled
        meson compile -C build-noorc/
      env:
        CC: clang
        CXX: clang++
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: Meson_LLVM_Testlog
        path: |
          build/meson-logs/testlog.txt
          build-noorc/meson-logs/meson-log.txt
