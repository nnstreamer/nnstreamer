name: Build and test the ExecuTorch tensor_filter

# ExecuTorch has to be built from source (no distro package, no prebuilt
# desktop binary, and its pip wheel is headers only), which is far too slow to
# put on every pull request. The install tree is therefore cached, and the job
# runs only when something that can break it changes -- plus daily, which also
# keeps the cache from being evicted for inactivity.
on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/executorch.yml'
      - 'ext/nnstreamer/tensor_filter/tensor_filter_executorch.cc'
      - 'ext/nnstreamer/tensor_filter/meson.build'
      # the tensor_filter API and core the subplugin is built against
      - 'gst/nnstreamer/include/**'
      - 'gst/nnstreamer/tensor_filter/**'
      - 'meson.build'
      - 'meson_options.txt'
      - 'tests/nnstreamer_filter_executorch/**'
      # the fixtures and the generator that SSAT suite runs on
      - 'tests/nnstreamer_converter/generateTest.py'
      - 'tests/test_models/models/*.pte'
      - 'tools/executorch-install.sh'
  schedule:
    # 04:00 AM (KST) Mon-Fri
    - cron: "00 19 * * 0-4"
  workflow_dispatch:

env:
  EXECUTORCH_VERSION: v1.4.1
  EXECUTORCH_PREFIX: /home/runner/executorch-install

jobs:
  build:
    name: Build against ExecuTorch and run its SSAT suite
    runs-on: ubuntu-22.04
    # A cache miss rebuilds ExecuTorch from source; a cache hit is minutes.
    timeout-minutes: 180

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: restore the ExecuTorch install tree
      id: cache-executorch
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.EXECUTORCH_PREFIX }}
        key: executorch-${{ runner.os }}-${{ runner.arch }}-${{ env.EXECUTORCH_VERSION }}-${{ hashFiles('tools/executorch-install.sh') }}

    - name: install requirements
      run: |
        sudo apt-get update
        sudo apt-get install -y libglib2.0-dev libjson-glib-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libunwind-dev googletest
        sudo apt-get install -y liborc-0.4-dev flex bison libopencv-dev pkg-config python3-dev python3
        sudo apt-get install -y gstreamer1.0-tools gstreamer1.0-plugins-good gstreamer1.0-plugins-base libgtest-dev libpng-dev
        sudo add-apt-repository -y ppa:nnstreamer/ppa && sudo apt-get update && sudo apt-get install -y ssat
        # ubuntu-22.04 carries cmake 3.22; ExecuTorch wants at least 3.24 and
        # caps itself below 4.0 in its own requirements-dev.txt.
        # numpy goes in with pip, not apt: setup-python puts its own python3
        # first on PATH, where the apt package is not visible, and the SSAT
        # script generates its test data with it.
        pip install meson ninja numpy 'cmake>=3.24,<4'

    - name: install the ExecuTorch build-time python dependencies
      if: steps.cache-executorch.outputs.cache-hit != 'true'
      run: |
        # ExecuTorch generates its operator kernel registration with torchgen,
        # which ships inside the torch wheel. The CPU wheel is enough and is a
        # fraction of the size of the default one.
        # torch is pinned to what ExecuTorch v1.4.1 itself pins in
        # install_requirements.py. Unpinned it would already resolve to 2.14,
        # which no repository change would account for.
        pip install pyyaml
        pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu

    - name: build and install ExecuTorch
      id: build-executorch
      if: steps.cache-executorch.outputs.cache-hit != 'true'
      run: bash tools/executorch-install.sh "${EXECUTORCH_PREFIX}" "${EXECUTORCH_VERSION}"

    # Saved separately from the restore above, and even when a later step
    # fails, so that a red run does not force the next one to rebuild
    # ExecuTorch from scratch. Guarded on the build itself having succeeded,
    # so a half-installed tree cannot be cached and then restored forever.
    - name: save the ExecuTorch install tree
      if: '!cancelled() && steps.build-executorch.outcome == ''success'''
      uses: actions/cache/save@v4
      with:
        path: ${{ env.EXECUTORCH_PREFIX }}
        key: ${{ steps.cache-executorch.outputs.cache-primary-key }}

    - name: build nnstreamer with the ExecuTorch subplugin
      run: |
        export PKG_CONFIG_PATH="${EXECUTORCH_PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH}"
        meson setup build/ -Dexecutorch-support=enabled
        meson compile -C build/
        # -Dexecutorch-support=enabled already fails the configure when the
        # dependency is missing, but the subplugin can still be dropped from
        # the build for other reasons, and the SSAT script below reports
        # success with zero cases when the .so is absent.
        test -f build/ext/nnstreamer/tensor_filter/libnnstreamer_filter_executorch.so

    - name: unit test the ExecuTorch subplugin
      run: |
        export LD_LIBRARY_PATH="${EXECUTORCH_PREFIX}/lib:${LD_LIBRARY_PATH}"
        # Naming the test makes meson fail outright if it was not registered,
        # rather than reporting an empty run as success.
        meson test -C build/ unittest_filter_executorch --print-errorlogs
    - name: SSAT run on filter-executorch
      run: |
        export LD_LIBRARY_PATH="${EXECUTORCH_PREFIX}/lib:${LD_LIBRARY_PATH}"
        export NNSTREAMER_BUILD_ROOT_PATH="$(pwd)/build"
        export NNSTREAMER_FILTERS="$(pwd)/build/ext/nnstreamer/tensor_filter"
        export NNSTREAMER_DECODERS="$(pwd)/build/ext/nnstreamer/tensor_decoder"
        export NNSTREAMER_CONVERTERS="$(pwd)/build/ext/nnstreamer/tensor_converter"
        export GST_PLUGIN_PATH="$(pwd)/build/gst"
        export NNSTREAMER_CONF="$(pwd)/build/nnstreamer-test.ini"
        cd tests/nnstreamer_filter_executorch && ssat -n -p=1 --summary summary.txt
