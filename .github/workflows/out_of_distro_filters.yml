name: Build and test the tensor_filters of out-of-distro SDKs

# ExecuTorch and LibTorch come from no distro package, so a job that uses them
# has to fetch them itself. They share this one job, and with it the apt
# install and the build of nnstreamer, instead of having one check per library.
# A new SDK of that kind belongs here, too.
#
# This is the x86_64 entry. The arm64 entry of ExecuTorch runs in the arm leg of
# ubuntu_clean_meson_build.yml, whose build is already what it needs.
#
# ExecuTorch has to be built from source, and its install tree is therefore
# cached; update_executorch_cache.yml keeps that cache in place. LibTorch is a
# ~180 MB download taking seconds, and nothing is cached for it because the
# Actions cache of this repository is already full.
#
# The job starts on every pull request and looks at the changed files itself
# rather than using "paths:", so that it always reports: a workflow filtered
# with "paths:" reports nothing for an unrelated pull request, and a required
# check that never reports blocks the merge forever.
on:
  pull_request:
    branches: [ main ]
  schedule:
    # 04:30 AM (KST) Mon-Fri
    - cron: "30 19 * * 0-4"
  workflow_dispatch:
    inputs:
      libtorch_version:
        description: 'LibTorch release to try instead of the pinned one, e.g. 2.12.0 (give libtorch_sha256 too)'
        required: false
        default: ''
      libtorch_sha256:
        description: 'sha256 of libtorch-shared-with-deps-<version>+cpu.zip (give libtorch_version too)'
        required: false
        default: ''

permissions:
  contents: read
  pull-requests: read

# A scheduled or pull request run always builds against the releases pinned
# here, so it catches changes of this repository, not new releases: moving to a
# newer one is a manual change of these lines. The inputs of a manual run can
# try a newer LibTorch first. Keep the ExecuTorch lines the same as in
# ubuntu_clean_meson_build.yml and update_executorch_cache.yml: a different
# version or prefix is a different cache.
env:
  EXECUTORCH_VERSION: v1.4.1
  EXECUTORCH_PREFIX: /home/runner/executorch-install
  LIBTORCH_VERSION: ${{ inputs.libtorch_version || '2.11.0' }}
  LIBTORCH_SHA256: ${{ inputs.libtorch_sha256 || 'ee3f453f6c3e3d934339875d76a2b04d6a1731554c016fc82be1f4b8d1d4ae62' }}

jobs:
  build:
    # The arm64 entry and float16 are in ubuntu_clean_meson_build.yml; this entry
    # keeps float16 off and runs the ExecuTorch test expecting a float16 model to
    # be refused.
    name: Build and test the ExecuTorch and PyTorch tensor_filters (ubuntu-22.04)
    runs-on: ubuntu-22.04
    # A cache miss rebuilds ExecuTorch from source; a cache hit is minutes.
    timeout-minutes: 180

    steps:
    - name: look for changes that can break these subplugins
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -e -o pipefail
        # The files API below stops at 3000 files, so a pull request that large
        # is taken as relevant rather than judged on a truncated list.
        if [ '${{ github.event_name }}' != 'pull_request' ] \
            || [ '${{ github.event.pull_request.changed_files }}' -ge 3000 ]; then
          echo "relevant=true" >> "$GITHUB_ENV"
          exit 0
        fi
        # A renamed file counts under both of its names. A failure to list the
        # files fails this job.
        files=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')
        # - this workflow, the subplugins and their build recipe
        # - the tensor_filter API and core the subplugins are built against
        # - the fixtures and the generator that the SSAT suites run on
        pattern='^\.github/workflows/out_of_distro_filters\.yml$'
        pattern+='|^ext/nnstreamer/tensor_filter/(tensor_filter_(executorch(_llama)?|pytorch)\.cc|meson\.build)$'
        pattern+='|^gst/nnstreamer/((include|tensor_filter)/|[^/]*\.[ch]$)'
        pattern+='|^(meson\.build|meson_options\.txt|tests/meson\.build)$'
        pattern+='|^tests/nnstreamer_filter_(executorch(_llama)?|pytorch)/'
        pattern+='|^tests/nnstreamer_converter/generateTest\.py$'
        pattern+='|^tests/test_models/data/9\.png$'
        pattern+='|^tests/test_models/models/([^/]*\.(pte|pt)|llm_next_letter_tokenizer\.model)$'
        pattern+='|^tools/executorch-install\.sh$'
        # Not a pipe: grep -q leaves at the first match, and under pipefail a
        # writer killed by SIGPIPE would turn that match into "not relevant".
        if grep -qE "${pattern}" <<< "${files}"; then
          echo "relevant=true" >> "$GITHUB_ENV"
        else
          echo "relevant=false" >> "$GITHUB_ENV"
        fi

    - if: env.relevant == 'true'
      uses: actions/checkout@v4
    - if: env.relevant == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: restore the ExecuTorch install tree
      id: cache-executorch
      if: env.relevant == 'true'
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.EXECUTORCH_PREFIX }}
        key: executorch-${{ runner.os }}-${{ runner.arch }}-${{ env.EXECUTORCH_VERSION }}-${{ hashFiles('tools/executorch-install.sh') }}

    - name: install requirements
      if: env.relevant == 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y libglib2.0-dev libjson-glib-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libunwind-dev googletest
        sudo apt-get install -y liborc-0.4-dev flex bison libopencv-dev pkg-config python3-dev python3
        sudo apt-get install -y gstreamer1.0-tools gstreamer1.0-plugins-good gstreamer1.0-plugins-base libgtest-dev libpng-dev
        sudo add-apt-repository -y ppa:nnstreamer/ppa && sudo apt-get update && sudo apt-get install -y ssat
        # numpy goes in with pip, not apt: setup-python puts its own python3
        # first on PATH, where the apt package is not visible, and the SSAT
        # scripts generate their test data with it.
        pip install meson ninja numpy

    - name: build and install ExecuTorch
      id: build-executorch
      if: env.relevant == 'true' && steps.cache-executorch.outputs.cache-hit != 'true'
      run: |
        # ExecuTorch generates its operator kernel registration with torchgen,
        # which ships inside the torch wheel. The CPU wheel is enough and is a
        # fraction of the size of the default one.
        # torch is pinned to what ExecuTorch v1.4.1 itself pins in
        # install_requirements.py. Unpinned it would already resolve to 2.14,
        # which no repository change would account for.
        # ubuntu-22.04 carries cmake 3.22; ExecuTorch wants at least 3.24 and
        # caps itself below 4.0 in its own requirements-dev.txt.
        # A virtual environment leaves all of this out of the nnstreamer build.
        python3 -m venv "${RUNNER_TEMP}/executorch-venv"
        source "${RUNNER_TEMP}/executorch-venv/bin/activate"
        pip install pyyaml numpy 'cmake>=3.24,<4'
        pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
        bash tools/executorch-install.sh "${EXECUTORCH_PREFIX}" "${EXECUTORCH_VERSION}"

    # Saved separately from the restore above, and even when a later step
    # fails, so that a red run does not force the next one to rebuild
    # ExecuTorch from scratch. Guarded on the build itself having succeeded,
    # so a half-installed tree cannot be cached and then restored forever.
    - name: save the ExecuTorch install tree
      if: '!cancelled() && steps.build-executorch.outcome == ''success'''
      uses: actions/cache/save@v4
      with:
        path: ${{ env.EXECUTORCH_PREFIX }}
        key: ${{ steps.cache-executorch.outputs.cache-primary-key }}

    - name: install LibTorch
      if: env.relevant == 'true'
      run: |
        # LibTorch ships no pkg-config file; meson looks the subplugin's
        # dependency up as torch.pc, so write one for the unpacked release.
        curl --retry 3 --retry-delay 5 -fsSL -o libtorch.zip \
          "https://download.pytorch.org/libtorch/cpu/libtorch-shared-with-deps-${LIBTORCH_VERSION}%2Bcpu.zip"
        echo "${LIBTORCH_SHA256}  libtorch.zip" | sha256sum -c
        unzip -q libtorch.zip -d "${RUNNER_TEMP}"
        rm libtorch.zip
        mkdir -p "${RUNNER_TEMP}/pkgconfig"
        cat << EOF > "${RUNNER_TEMP}/pkgconfig/torch.pc"
        prefix=${RUNNER_TEMP}/libtorch
        libdir=\${prefix}/lib
        includedir=\${prefix}/include

        Name: torch
        Description: LibTorch, the C++ distribution of PyTorch
        Version: ${LIBTORCH_VERSION}
        Libs: -L\${libdir} -Wl,-rpath,\${libdir} -ltorch -ltorch_cpu -lc10
        Cflags: -isystem \${includedir} -isystem \${includedir}/torch/csrc/api/include
        EOF

    - name: build nnstreamer with the subplugins
      id: build-nnstreamer
      if: env.relevant == 'true'
      run: |
        export PKG_CONFIG_PATH="${EXECUTORCH_PREFIX}/lib/pkgconfig:${RUNNER_TEMP}/pkgconfig:${PKG_CONFIG_PATH}"
        meson setup build/ -Dexecutorch-support=enabled -Dexecutorch-llama-support=enabled -Dpytorch-support=enabled
        meson compile -C build/
        # -D...-support=enabled already fails the configure when a dependency
        # is missing, but a subplugin can still be dropped from the build for
        # other reasons, and the SSAT scripts below report success with zero
        # cases when the .so is absent.
        test -f build/ext/nnstreamer/tensor_filter/libnnstreamer_filter_executorch.so
        test -f build/ext/nnstreamer/tensor_filter/libnnstreamer_filter_executorch-llama.so
        test -f build/ext/nnstreamer/tensor_filter/libnnstreamer_filter_pytorch.so

    # The test steps below all run once the build has passed, so that a failure
    # of one library does not hide the result of the other.
    - name: unit test the ExecuTorch subplugins
      if: '!cancelled() && steps.build-nnstreamer.outcome == ''success'''
      run: |
        export LD_LIBRARY_PATH="${EXECUTORCH_PREFIX}/lib:${LD_LIBRARY_PATH}"
        # Naming the test makes meson fail outright if it was not registered,
        # rather than reporting an empty run as success.
        meson test -C build/ unittest_filter_executorch unittest_filter_executorch_llama --print-errorlogs

    - name: SSAT run on filter-executorch
      if: '!cancelled() && steps.build-nnstreamer.outcome == ''success'''
      run: |
        export LD_LIBRARY_PATH="${EXECUTORCH_PREFIX}/lib:${LD_LIBRARY_PATH}"
        export NNSTREAMER_BUILD_ROOT_PATH="$(pwd)/build"
        export NNSTREAMER_FILTERS="$(pwd)/build/ext/nnstreamer/tensor_filter"
        export NNSTREAMER_DECODERS="$(pwd)/build/ext/nnstreamer/tensor_decoder"
        export NNSTREAMER_CONVERTERS="$(pwd)/build/ext/nnstreamer/tensor_converter"
        export GST_PLUGIN_PATH="$(pwd)/build/gst"
        export NNSTREAMER_CONF="$(pwd)/build/nnstreamer-test.ini"
        cd tests/nnstreamer_filter_executorch && ssat -n -p=1 --summary summary.txt

    - name: unit test the PyTorch subplugin
      if: '!cancelled() && steps.build-nnstreamer.outcome == ''success'''
      run: |
        meson test -C build/ unittest_plugins --print-errorlogs \
          --test-args='--gtest_filter=*.frameworkAutoExtPt01:*.frameworkAutoWoOptExtPt01'
        # gtest passes a filter that matches nothing, so check that both ran.
        ran=$(sed -nE 's/^\[  PASSED  \] ([0-9]+) tests?\.$/\1/p' build/meson-logs/testlog.txt | tail -1)
        if [ "${ran:-0}" -ne 2 ]; then
          echo "::error::Expected 2 pytorch cases of unittest_plugins to pass, but ${ran:-0} did."
          exit 1
        fi

    - name: SSAT run on filter-pytorch
      if: '!cancelled() && steps.build-nnstreamer.outcome == ''success'''
      run: |
        export NNSTREAMER_BUILD_ROOT_PATH="$(pwd)/build"
        export NNSTREAMER_FILTERS="$(pwd)/build/ext/nnstreamer/tensor_filter"
        export NNSTREAMER_DECODERS="$(pwd)/build/ext/nnstreamer/tensor_decoder"
        export NNSTREAMER_CONVERTERS="$(pwd)/build/ext/nnstreamer/tensor_converter"
        export GST_PLUGIN_PATH="$(pwd)/build/gst"
        export NNSTREAMER_CONF="$(pwd)/build/nnstreamer-test.ini"
        cd tests/nnstreamer_filter_pytorch && ssat -n -p=1 --summary summary.txt
        cat summary.txt
        # A run of zero cases means that the script skipped everything.
        grep -qE '^passed=[1-9][0-9]*, failed=0' summary.txt
