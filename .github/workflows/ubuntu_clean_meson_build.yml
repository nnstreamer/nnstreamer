name: Minimal meson build in Ubuntu with Valgrind

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build with meson and test with Valgrind in Ubuntu
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04, ubuntu-22.04-arm ]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Check if rebuild required
      uses: ./.github/actions/check-rebuild
      with:
        mode: rebuild
    - if: env.rebuild == '1'
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: install requirements
      if: env.rebuild == '1'
      run: |
        sudo apt-get update && sudo apt-get install -y libglib2.0-dev libjson-glib-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libunwind-dev googletest gdb
        sudo apt-get install -y liborc-0.4-dev flex bison libopencv-dev pkg-config python3-dev python3-numpy python3
        sudo add-apt-repository -y ppa:nnstreamer/ppa && sudo apt-get update && sudo apt-get install -y ssat libpaho-mqtt-dev
        sudo apt-get install -y valgrind gstreamer1.0-tools gstreamer1.0-plugins-good gstreamer1.0-plugins-base libgtest-dev libpng-dev libc6-dbg binutils-x86-64-linux-gnu-dbg valgrind-dbg
        sudo apt-get install -y libarmnn-dev libarmnntfliteparser-dev libarmnn-cpuref-backend22
        # The armnn subplugin auto-selects the NEON-accelerated CpuAcc backend on arm.
        if [ "$(dpkg --print-architecture)" = "arm64" ]; then sudo apt-get install -y libarmnn-cpuacc-backend22; fi
        if [ '${{ matrix.os }}' == 'ubuntu-22.04' ]; then sudo apt-get install -y tigervnc-standalone-server python3-gi python3-gi-cairo coreutils procps; fi
        pip install meson ninja
    - name: install llama.cpp for the llamacpp tensor-filter
      if: env.rebuild == '1' && matrix.os == 'ubuntu-22.04'
      run: |
        # Install a pinned prebuilt llama.cpp release (x64 only) so that the
        # llamacpp tensor-filter and its unit tests are built and run here.
        # llama.cpp does not ship a dev package or pkg-config file, and ggml
        # searches dynamic backends relative to the executable rather than
        # FHS paths (ggml-org/ggml#1120); hence the hand-written llama.pc
        # here and the backend copy into build/tests/ after the build.
        LLAMA_VERSION="b6569"
        curl -fsSL -o llama-bin.zip "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_VERSION}/llama-${LLAMA_VERSION}-bin-ubuntu-x64.zip"
        curl -fsSL -o llama-src.zip "https://github.com/ggml-org/llama.cpp/archive/refs/tags/${LLAMA_VERSION}.zip"
        echo "52cc91b7b0a0d8e40bc79f7049a0b03c9055ac90ddcdf9f1f7307c5f3939634e  llama-bin.zip" | sha256sum -c
        # Auto-generated source archive: its checksum is stable in practice but
        # not permanently guaranteed by GitHub; update the hash if it changes.
        echo "25c8a7c5f5f8411659ccfa7c24caacc5f7d7a36ea758d120e2429a888612d447  llama-src.zip" | sha256sum -c
        unzip -q llama-bin.zip -d llama-prebuilt
        unzip -q llama-src.zip -d llama-prebuilt

        sudo cp llama-prebuilt/build/bin/*.so /usr/local/lib/
        sudo cp llama-prebuilt/llama.cpp-${LLAMA_VERSION}/include/*.h /usr/local/include/
        sudo cp llama-prebuilt/llama.cpp-${LLAMA_VERSION}/ggml/include/*.h /usr/local/include/

        mkdir -p ~/llama-backends
        cp llama-prebuilt/build/bin/libggml-*.so ~/llama-backends/

        sudo mkdir -p /usr/local/lib/pkgconfig
        cat << 'EOF' | sudo tee /usr/local/lib/pkgconfig/llama.pc
        prefix=/usr/local
        exec_prefix=${prefix}
        libdir=${prefix}/lib
        includedir=${prefix}/include

        Name: llama
        Description: C/C++ inference of LLaMA-family models
        Version: 0.0.0
        Libs: -L${libdir} -lggml -lggml-base -lllama
        Cflags: -I${includedir}
        EOF
        sudo sed -i "s/^Version: .*/Version: 0.0.${LLAMA_VERSION#b}/" /usr/local/lib/pkgconfig/llama.pc
        sudo ldconfig
        rm -rf llama-bin.zip llama-src.zip llama-prebuilt/

        mkdir -p tests/test_models/models
        curl -fsSL -o tests/test_models/models/TinyStories-656K-Q2_K.gguf \
          "https://huggingface.co/tensorblock/TinyStories-656K-GGUF/resolve/main/TinyStories-656K-Q2_K.gguf"
        echo "5a798ebc1cad921e0ce639b2f10c4bcce492654a79d4b4ca52bd0268416f6b87  tests/test_models/models/TinyStories-656K-Q2_K.gguf" | sha256sum -c
    - name: install LiteRT SDK (x86_64 only)
      if: env.rebuild == '1' && matrix.os == 'ubuntu-22.04'
      run: |
        # When bumping LITERT_VER, refresh the pinned hashes below:
        # the zip hash from the release asset, the wheel hashes from
        # https://pypi.org/pypi/ai-edge-litert/<ver>/json (digests.sha256).
        # The wheel hash is per python tag: this job pins python 3.11 above,
        # so the cp311 manylinux_2_27_x86_64 wheel is the one downloaded.
        LITERT_VER=2.2.0
        LITERT_SDK_ZIP_SHA256=0aa619d80aef27303ad9c6e3759a20110f77e7b11ade9b68061b8c6e5904b0c6
        LITERT_WHEEL_SHA256=0171f556fffa335281acd7d468de999fd4de32f6bf1a5f14e680676591cef764
        LITERT_ROOT=$HOME/litert-sdk
        mkdir -p $LITERT_ROOT/lib $LITERT_ROOT/include/litert/build_common
        wget -q https://github.com/google-ai-edge/LiteRT/releases/download/v${LITERT_VER}/litert_cc_sdk.zip
        echo "${LITERT_SDK_ZIP_SHA256}  litert_cc_sdk.zip" | sha256sum -c -
        unzip -q litert_cc_sdk.zip -d /tmp/litert-cc-sdk
        cp -r /tmp/litert-cc-sdk/litert_cc_sdk/litert/c $LITERT_ROOT/include/litert/
        # generate build_config.h (all optional features off at compile time;
        # the prebuilt runtime .so ships its own feature set)
        sed -e 's/#cmakedefine01 \(.*\)/#define \1 0/' \
          /tmp/litert-cc-sdk/litert_cc_sdk/litert/build_common/build_config.h.in \
          > $LITERT_ROOT/include/litert/build_common/build_config.h
        # take the prebuilt runtime library from the official pip wheel,
        # with the expected wheel content pinned by hash
        printf 'ai-edge-litert==%s --hash=sha256:%s\n' \
          "$LITERT_VER" "$LITERT_WHEEL_SHA256" > /tmp/litert-req.txt
        pip download --require-hashes --no-deps -q -r /tmp/litert-req.txt -d /tmp/litert-wheel
        unzip -q -o /tmp/litert-wheel/*.whl 'ai_edge_litert/libLiteRt.so' -d /tmp/litert-wheel/x
        cp /tmp/litert-wheel/x/ai_edge_litert/libLiteRt.so $LITERT_ROOT/lib/
        echo "LITERT_ROOT=$LITERT_ROOT" >> $GITHUB_ENV
        echo "LD_LIBRARY_PATH=$LITERT_ROOT/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
    - name: build and unit test
      if: env.rebuild == '1'
      run: |
        meson setup build/ -Darmnn-support=enabled
        meson compile -C build/

        if [ '${{ matrix.os }}' == 'ubuntu-22.04' ]; then
          # Fail loudly if meson stopped detecting llama.cpp; otherwise the
          # llamacpp tests would silently vanish from this job.
          test -f build/ext/nnstreamer/tensor_filter/libnnstreamer_filter_llamacpp.so
          cp ~/llama-backends/libggml-*.so build/tests/
          # Same for litert: the feature degrades to "off" silently under auto
          # detection and its SSAT script reports success with zero cases when
          # the .so is absent; assert so a detection regression cannot go green.
          test -f build/ext/nnstreamer/tensor_filter/libnnstreamer_filter_litert.so
        fi

        sudo mkdir -m 777 /cores
        sudo bash -c 'echo "/cores/coredump" > /proc/sys/kernel/core_pattern'

        ulimit -c unlimited

        meson test -C build/ -v
      env:
        CC: gcc
    - name: Upload core if something went wrong
      uses: actions/upload-artifact@v4
      if: ${{ failure() }}
      with:
        name: cores
        path: /cores
    - name: Try to show a stack trace if something went wrong
      if: ${{ failure() }}
      run: |
        if [[ -f /cores/coredump ]]; then
          ERROREXEC=`gdb -c /cores/coredump -batch -ex bt | grep "Core was generated by " | sed "s|Core was generated by \`||" | sed "s|'.||"`
          echo "::group::There is a core dump file. The backtrace shows:"
          gdb ${ERROREXEC} -c coredump -batch -ex bt
          echo "::endgroup::"
        fi
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: Meson_Testlog
        path: build/meson-logs/testlog.txt
    - name: SSAT run with Valgrind on decoder-bounding-box
      if: env.rebuild == '1'
      run: if [ '${{ matrix.os }}' == 'ubuntu-22.04' ]; then export NNSTREAMER_BUILD_ROOT_PATH=`pwd`/build && export NNSTREAMER_FILTERS=`pwd`/build/ext/nnstreamer/tensor_filter && export NNSTREAMER_DECODERS=`pwd`/build/ext/nnstreamer/tensor_decoder && export NNSTREAMER_CONVERTERS=`pwd`/build/ext/nnstreamer/tensor_converter && export GST_PLUGIN_PATH=`pwd`/build/gst && export NNSTREAMER_CONF=`pwd`/build/nnstreamer-test.ini && pushd tests/nnstreamer_decoder_boundingbox && G_SLICE=always-malloc G_DEBUG=gc-friendly ssat -n -p=1 --enable-valgrind --valgrind-suppression ../../tools/debugging/valgrind_suppression --summary summary.txt -cn _n && popd; fi
    - name: SSAT run on filter-litert
      if: env.rebuild == '1'
      run: if [ '${{ matrix.os }}' == 'ubuntu-22.04' ] && [ -n "$LITERT_ROOT" ]; then export NNSTREAMER_BUILD_ROOT_PATH=`pwd`/build && export NNSTREAMER_FILTERS=`pwd`/build/ext/nnstreamer/tensor_filter && export NNSTREAMER_DECODERS=`pwd`/build/ext/nnstreamer/tensor_decoder && export NNSTREAMER_CONVERTERS=`pwd`/build/ext/nnstreamer/tensor_converter && export GST_PLUGIN_PATH=`pwd`/build/gst && export NNSTREAMER_CONF=`pwd`/build/nnstreamer-test.ini && pushd tests/nnstreamer_filter_litert && ssat -n -p=1 --summary summary.txt && popd; fi
    - name: GTEST run with Valgrind on a case
      if: env.rebuild == '1'
      run: if [ '${{ matrix.os }}' == 'ubuntu-22.04' ]; then export NNSTREAMER_BUILD_ROOT_PATH=`pwd`/build && export NNSTREAMER_FILTERS=`pwd`/build/ext/nnstreamer/tensor_filter && export NNSTREAMER_DECODERS=`pwd`/build/ext/nnstreamer/tensor_decoder && export NNSTREAMER_CONVERTERS=`pwd`/build/ext/nnstreamer/tensor_converter && export GST_PLUGIN_PATH=`pwd`/build/gst && export NNSTREAMER_CONF=`pwd`/build/nnstreamer-test.ini && G_SLICE=always-malloc G_DEBUG=gc-friendly ./packaging/run_unittests_binaries.sh --valgrind ./tests/ || echo "There are Valgrind errors. Please fix it. As we have a lot of Valgrind errors from different libraries and possible from nnstreamer itself, we are not halting the build with Valgrind errors until we get them all."; fi
    - name: get NNStreamer example apps
      if: env.rebuild == '1' && matrix.os == 'ubuntu-22.04'
      uses: actions/checkout@v4
      with:
        repository: nnstreamer/nnstreamer-example
        path: examples
    - name: get V4L2 loopback
      if: env.rebuild == '1' && matrix.os == 'ubuntu-22.04'
      uses: actions/checkout@v4
      with:
        repository: umlaeute/v4l2loopback
        ref: 0f9ee86760b7f2bea174b7e3e7a1d38845da0ab4  # v0.15.4
        path: v4l2loopback
    - name: NNStreamer example app test
      if: env.rebuild == '1' && matrix.os == 'ubuntu-22.04'
      timeout-minutes: 30
      run: |
        # Enable the tflite subplugin only for this app test; installing it
        # before "build and unit test" would pull tflite unit tests into
        # meson test, changing the coverage this minimal workflow has today.
        echo "::group::Rebuild with the tensorflow2-lite subplugin"
        sudo apt-get install -y tensorflow2-lite-dev
        meson setup --reconfigure build/
        meson compile -C build/
        echo "::endgroup::"
        export GST_PLUGIN_PATH=$(pwd)/build/gst/nnstreamer
        currentpath=$(pwd)
        sed "s|@SUBPLUGIN_INSTALL_PREFIX@|${currentpath}|" .github/workflows/ubuntu_clean_meson_build.nnstreamer.ini > "${RUNNER_TEMP}/nnstreamer.ini"
        sudo cp "${RUNNER_TEMP}/nnstreamer.ini" /etc/nnstreamer.ini
        pushd examples
        # The example apps log through _print_log() and always exit 0, even on
        # failure; turn DBG on so the assertions below can observe the logs.
        sed -i "s|#define DBG FALSE|#define DBG TRUE|" \
          native/example_sink/nnstreamer_sink_example.c \
          native/example_sink/nnstreamer_sink_example_play.c \
          native/example_cam/nnstreamer_example_cam.c \
          native/example_image_classification_tflite/nnstreamer_example_image_classification_tflite.c
        echo "::group::Build example apps"
        meson setup --prefix=$(pwd) --sysconfdir=$(pwd) --libdir=lib --bindir=bin --includedir=include build
        ninja -C build install
        echo "::endgroup::"
        pushd bin
        echo "::group::Fetch an image classification model"
        bash get-model-image-classification-tflite.sh
        echo "::endgroup::"
        popd
        popd

        echo "Install a V4L2 cam with videotestsrc"
        declare -i xvnc_port=31
        if [[ ! -e /dev/video0 ]]; then
          pushd v4l2loopback
          make clean
          make
          if [[ ! -f "/lib/modules/`uname -r`/kernel/drivers/media/media.ko" ]]; then
            echo "installing media.ko and videodev.ko with linux-modules-extra-`uname -r`"
            sudo apt-get install -y linux-modules-extra-`uname -r`
          fi
          sudo modprobe media || echo "media.ko not in extra?"
          sudo modprobe videodev || echo "videodev.ko not in extra?"
          sudo insmod ./v4l2loopback.ko
          popd
        fi
        # insmod returns before udev applies its rule (root:video 0660), which
        # would silently undo the chmod below; wait for udev first.
        sudo udevadm settle
        sudo chmod a+rw /dev/video0
        ls -la /dev/video0
        if [[ ! -f ~/.Xauthority ]]; then
          touch ~/.Xauthority
        fi

        declare -i xvnc_pid=0
        if [[ `ps -A -o pid,cmd | grep "[\:]${xvnc_port}" | wc -l` == "1" ]]; then
          xvnc_pid=$(ps -A -o pid,cmd | grep "[\:]${xvnc_port}" | awk '{printf $1}')
          if [[ $xvnc_pid -ne 0 ]]; then
            kill $xvnc_pid
            echo "killed a stale xvnc"
          fi
        fi

        echo "Launching Xtigervnc at port ${xvnc_port}"
        Xtigervnc :${xvnc_port} &
        export DISPLAY=:${xvnc_port}
        declare -i producer_id=0

        # identity drop-allocation=true keeps v4l2sink from importing the
        # loopback device's buffers, which fails on v4l2loopback.
        gst-launch-1.0 videotestsrc ! video/x-raw,format=YUY2,width=640,height=480,framerate=30/1 ! identity drop-allocation=true ! v4l2sink device=/dev/video0 &
        producer_id=$!
        sleep 5
        echo "V4L2 loopback producer is = ${producer_id}"
        if ! kill -0 ${producer_id} 2>/dev/null; then
          echo "::error::The v4l2loopback producer pipeline has died."
          exit 1
        fi

        echo "::group::Simple gstreamer pipeline"
        timeout 2 gst-launch-1.0 v4l2src device=/dev/video0 ! videoconvert ! ximagesink || if [[ "124" != "$?" ]]; then exit 1; fi
        echo "::endgroup::"

        pushd examples/bin

        # Run one example app and assert on its logs, not its exit code: the
        # apps return 0 even when they bail out on an error.
        run_example () {
          name="$1"; marker="$2"; shift 2
          echo "::group::${name}"
          applog=$(mktemp)
          timeout 2 "$@" > "${applog}" 2>&1 || if [[ "124" != "$?" ]]; then
            cat "${applog}"
            echo "::error::${name} exited abnormally."
            exit 1
          fi
          cat "${applog}"
          if grep -q "app failed" "${applog}"; then
            echo "::error::${name} reported an internal failure."
            exit 1
          fi
          if ! grep -q "${marker}" "${applog}"; then
            echo "::error::${name} did not log '${marker}'."
            exit 1
          fi
          echo "::endgroup::"
        }

        run_example "V4L2Cam --> Image Classification (C/GStreamer)" \
          "receiving new data" ./nnstreamer_example_image_classification_tflite

        echo "::group::V4L2Cam --> Image Classification (Python/GStreamer)"
        # The system python has the apt-installed gi module; the job's default
        # python3 is from setup-python and does not.
        pylog=$(mktemp)
        timeout 2 /usr/bin/python3 nnstreamer_example_image_classification_tflite.py > "${pylog}" 2>&1 || if [[ "124" != "$?" ]]; then
          cat "${pylog}"
          echo "::error::The python example exited abnormally."
          exit 1
        fi
        cat "${pylog}"
        if grep -qE "ERROR|Traceback" "${pylog}"; then
          echo "::error::The python example logged an error."
          exit 1
        fi
        echo "::endgroup::"

        run_example "V4L2Cam --> Tensor Stream Path Manipulators (C/GStreamer)" \
          "received start message" ./nnstreamer_example_cam

        run_example "Sink examples (C/GStreamer, videotestsrc)" \
          "total received" ./nnstreamer_sink_example

        run_example "Sink examples with more tensor paths (C/GStreamer, videotestsrc)" \
          "received start message" ./nnstreamer_sink_example_play

        kill ${producer_id} || true

        popd

# TODO: add more subplugins to be built
# TODO: add unit testing
# TODO: add valgrind testing
