name: Build and unit test/ Pdebuild Ubuntu 22.04

# ${{ github.event.pull_request.commits }} : # commits in this PR
# - changed_file_list in GITHUB_ENV: the list of files updated in this pull-request.

## @todo apply "cache" to pdebuilder cache, or create docker images ready for pdebuild

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Ubuntu pdebuild on Ubuntu
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-22.04 ]
        arch: [ amd64 ]
        include:
          - distroname: jammy
            os: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: -${{ github.event.pull_request.commits }}
    - name: Check if rebuild required
      uses: ./.github/actions/check-rebuild
      with:
        mode: debian
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: make cache dir for pbuilder
      ## prevent permission error
      run: sudo mkdir --mode a=rwx --parents /var/cache/pbuilder

    - name: get date
      id: get-date
      run: |
        echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

    - name: restore pbuilder cache
      id: restore-pbuilder-cache
      if: env.rebuild == '1'
      uses: actions/cache/restore@v4
      with:
        path: |
          /var/cache/pbuilder/aptcache
          /var/cache/pbuilder/base.tgz
        key: pbuilder-cache-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('**/debian/control') }}-${{ steps.get-date.outputs.date }}
        restore-keys: |
          pbuilder-cache-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('**/debian/control') }}-
          pbuilder-cache-${{ matrix.os }}-${{ matrix.arch }}-

    - name: prepare pdebuild
      if: env.rebuild == '1'
      run: |
        echo "Installing build tools"
        # Drop the runner image's packages.microsoft.com sources: this build does not
        # use them and that host intermittently answers 403, failing apt-get update.
        echo "::group::drop unused third-party apt sources"
        # grep exits 1 when there is nothing to remove, which is not a failure here.
        { sudo grep -rlZ 'packages\.microsoft\.com' /etc/apt/sources.list.d/ || true; } | sudo xargs -0r rm -fv
        echo "::endgroup::"
        sudo add-apt-repository ppa:nnstreamer/ppa
        # Keep update and install separate: errexit ignores a failure before "&&".
        echo "::group::apt-get update"
        # "&& break" leans on that same rule: a failed attempt must not abort the step.
        for i in 1 2 3; do
          sudo apt-get update && break
          if [ "$i" = 3 ]; then
            echo "::error::apt-get update failed after $i attempts"
            exit 1
          fi
          sleep $((i * 10))
        done
        echo "::endgroup::"
        echo "::group::apt-get install"
        sudo apt-get install -y pbuilder debootstrap curl ubuntu-dev-tools qemu-user-static debian-archive-keyring ubuntu-keyring debhelper
        echo "::endgroup::"
        echo "DISTRIBUTION=${{ matrix.distroname }}" > ~/.pbuilderrc
        echo "OTHERMIRROR=\"deb [trusted=yes] http://archive.ubuntu.com/ubuntu ${{ matrix.distroname }}-backports universe |deb [trusted=yes] http://ppa.launchpad.net/nnstreamer/ppa/ubuntu ${{ matrix.distroname }} main |deb [trusted=yes] http://ppa.launchpad.net/kubuntu-ppa/backports-extra/ubuntu ${{ matrix.distroname }} main\"" >> ~/.pbuilderrc
        cat ~/.pbuilderrc
        sudo mkdir -p /root/
        sudo ln -sf ~/.pbuilderrc /root/

    - name: make pbuilder base.tgz
      if: ${{ env.rebuild == '1' && steps.restore-pbuilder-cache.outputs.cache-hit != 'true' }}
      run: |
        echo "=== pbuilder create"
        echo "::group::pbuilder create --allow-untrusted"
        sudo pbuilder create --allow-untrusted
        echo "::endgroup::"
        echo "=== pbuilder update"
        echo "::group::pbuilder update --distribution ${{ matrix.distroname }}"
        sudo pbuilder update --distribution ${{ matrix.distroname }}
        echo "::endgroup"
        echo "::group::pbuilder update"
        sudo pbuilder update
        echo "::endgroup"

    - name: run pdebuild
      if: env.rebuild == '1'
      run: |
        pdebuild --architecture ${{ matrix.arch }} -- --distribution ${{ matrix.distroname }}
