<!-- Parser models for standalone files without GLib/GStreamer includes.
     Version predicates select the supported Ubuntu 26.04 API branches.
     Caps models retain string concatenation; they do not validate caps values. -->
<def format="2">
  <define name="G_GSIZE_FORMAT" value="&quot;zu&quot;"/>
  <define name="G_GSSIZE_FORMAT" value="&quot;zi&quot;"/>
  <define name="G_GINT64_FORMAT" value="&quot;lli&quot;"/>
  <define name="G_GUINT64_FORMAT" value="&quot;llu&quot;"/>
  <define name="G_GINT64_MODIFIER" value="&quot;ll&quot;"/>
  <define name="GST_TIME_FORMAT" value="&quot;u:%02u:%02u.%09u&quot;"/>
  <define name="GST_PTR_FORMAT" value="&quot;p&quot;"/>
  <define name="GST_CHECK_VERSION(major,minor,micro)" value="1"/>
  <define name="GLIB_CHECK_VERSION(major,minor,micro)" value="1"/>
  <define name="GST_VIDEO_CAPS_MAKE(format)" value="&quot;video/x-raw, format=(string)&quot; format"/>
  <define name="GST_AUDIO_CAPS_MAKE(format)" value="&quot;audio/x-raw, format=(string)&quot; format"/>
  <define name="GST_TENSOR_CAP_DEFAULT" value="&quot;other/tensor&quot;"/>
  <define name="GST_TENSORS_CAP_DEFAULT" value="&quot;other/tensors&quot;"/>
  <define name="GST_TENSORS_FLEX_CAP_DEFAULT" value="&quot;other/tensors,format=flexible&quot;"/>
  <define name="G_UNLIKELY(expr)" value="(expr)"/>
  <define name="G_LIKELY(expr)" value="(expr)"/>
  <define name="G_DEFINE_TYPE_WITH_CODE(TN,t_n,T_P,_C_)" value=""/>
  <define name="GST_STIME_FORMAT" value="&quot;c%u:%02u:%02u.%09u&quot;"/>
</def>
